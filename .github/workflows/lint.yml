name: lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Find the scripts
        id: scripts
        run: |
          find . -name '*.sh' -not -path './.git/*' | tee scripts.txt
      - name: Syntax check
        run: |
          while read -r f; do
            echo "bash -n $f"
            bash -n "$f"
          done < scripts.txt
      - name: shellcheck
        run: |
          status=0
          while read -r f; do
            echo "::group::shellcheck $f"
            shellcheck -S warning "$f" || status=1
            echo "::endgroup::"
          done < scripts.txt
          exit $status

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the license file is the real GPL-3.0
        run: |
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE
          grep -q "Version 3, 29 June 2007" LICENSE
          grep -q "END OF TERMS AND CONDITIONS" LICENSE
      - name: Every skill has its manifest
        run: |
          find . -path './.git' -prune -o -name 'SKILL.md' -print | while read -r f; do
            echo "checking $f"
            head -1 "$f" | grep -q '^---$'
            grep -q '^name:' "$f"
            grep -q '^description:' "$f"
          done
